<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>you2music - 管理后台</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans SC", sans-serif; margin: 24px; max-width: 1100px; line-height: 1.5; }
      h1, h2, h3 { margin: 0 0 12px; }
      input, select, textarea, button { width: 100%; padding: 10px; font-size: 14px; font-family: inherit; }
      textarea { min-height: 260px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      label { display:block; margin: 10px 0 6px; font-weight: 600; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border-bottom: 1px solid rgba(127,127,127,.25); padding: 8px; text-align: left; vertical-align: middle; }
      th { font-size: 13px; opacity: .8; }
      .card { border: 1px solid rgba(127,127,127,.35); border-radius: 10px; padding: 16px; margin-top: 14px; }
      .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .actions button, .actions a { width: auto; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .muted { opacity: .8; font-size: 13px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .err { color: #b00020; white-space: pre-wrap; margin-top: 8px; }
      .ok { color: #1b7f3a; }
      .hidden { display: none !important; }
      .danger { color: #b00020; border: 1px solid #b00020; background: transparent; }
      @media (max-width: 760px) {
        body { margin: 14px; }
        .grid { grid-template-columns: 1fr; }
        table, thead, tbody, tr, th, td { display: block; }
        th { display: none; }
        td { border-bottom: none; padding: 6px 0; }
        td::before { content: attr(data-label); display: block; font-weight: 600; font-size: 12px; opacity: .7; margin-bottom: 2px; }
        tr { border-bottom: 1px solid rgba(127,127,127,.25); padding: 8px 0; }
      }
    </style>
  </head>
  <body>
    <h1>管理后台</h1>
    <p class="muted">所有管理员操作使用 JWT 登录态；旧的 admin_token 不再用于接口鉴权。</p>

    <div class="card" id="loginCard">
      <h2>登录</h2>
      <div class="grid">
        <div>
          <label for="username">用户名</label>
          <input id="username" autocomplete="username">
        </div>
        <div>
          <label for="password">密码</label>
          <input id="password" type="password" autocomplete="current-password">
        </div>
      </div>
      <div class="actions" style="margin-top: 10px;">
        <button id="loginBtn">登录</button>
        <span id="loginStatus" class="muted"></span>
      </div>
      <div id="loginError" class="err"></div>
    </div>

    <div id="adminApp" class="hidden">
      <div class="card">
        <div class="actions" style="justify-content: space-between;">
          <div>
            <strong id="accountName">-</strong>
            <span class="muted" id="accountRole"></span>
          </div>
          <div class="actions">
            <a href="/" class="muted">返回首页</a>
            <button id="logoutBtn">退出</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="actions" style="justify-content: space-between;">
          <h2>用户管理</h2>
          <button id="reloadUsersBtn">刷新</button>
        </div>
        <div id="usersOut"></div>
      </div>

      <div class="card">
        <div class="actions" style="justify-content: space-between;">
          <h2>邀请码</h2>
          <button id="createInviteBtn">生成邀请码</button>
        </div>
        <div id="inviteStatus" class="muted"></div>
        <div id="inviteOut" style="margin-top:10px;"></div>
      </div>

      <div class="card">
        <div class="actions" style="justify-content: space-between;">
          <h2>Provider 配置</h2>
          <div class="actions">
            <button id="loadConfigBtn">加载</button>
            <button id="saveConfigBtn">保存</button>
            <button id="reloadConfigBtn">应用</button>
            <button id="testBtn">测试</button>
          </div>
        </div>
        <textarea id="configJson" spellcheck="false"></textarea>
        <div class="muted">保存时会移除旧的 <span class="mono">admin_token</span> 字段；密钥保持 <span class="mono">********</span> 时后端会保留原值。</div>
        <div id="configStatus" class="muted"></div>
        <div id="configError" class="err"></div>
        <pre id="testOut" class="mono muted" style="white-space:pre-wrap;"></pre>
      </div>
    </div>

    <script>
      let authToken = localStorage.getItem("you2music.jwt") || "";
      let currentUser = null;

      const loginCard = document.getElementById("loginCard");
      const adminApp = document.getElementById("adminApp");
      const loginStatus = document.getElementById("loginStatus");
      const loginError = document.getElementById("loginError");
      const usersOut = document.getElementById("usersOut");
      const inviteOut = document.getElementById("inviteOut");
      const inviteStatus = document.getElementById("inviteStatus");
      const configJson = document.getElementById("configJson");
      const configStatus = document.getElementById("configStatus");
      const configError = document.getElementById("configError");
      const testOut = document.getElementById("testOut");

      async function fetchJson(url, opts) {
        const nextOpts = Object.assign({}, opts || {});
        const headers = Object.assign({}, nextOpts.headers || {});
        if (authToken) headers.Authorization = `Bearer ${authToken}`;
        nextOpts.headers = headers;
        const res = await fetch(url, nextOpts);
        const text = await res.text();
        let data = {};
        try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
        if (!res.ok) throw new Error(formatApiError(data, text || `HTTP ${res.status}`));
        return data;
      }

      function formatApiError(data, fallback) {
        if (!data) return fallback || "请求失败";
        const detail = data.detail !== undefined ? data.detail : (data.error !== undefined ? data.error : data.raw);
        if (Array.isArray(detail)) {
          const lines = detail.map(item => {
            if (!item || typeof item !== "object") return String(item);
            const field = Array.isArray(item.loc) ? item.loc.filter(x => x !== "body").join(".") : "";
            return formatValidationItem(field, item);
          }).filter(Boolean);
          return lines.length ? lines.join("\n") : (fallback || "输入不符合要求");
        }
        if (detail && typeof detail === "object") {
          if (detail.msg || detail.message) return String(detail.msg || detail.message);
          try { return JSON.stringify(detail); } catch { return fallback || "请求失败"; }
        }
        return String(detail || fallback || "请求失败");
      }

      function fieldLabel(field) {
        const labels = {
          username: "用户名",
          password: "密码",
          invite_code: "邀请码",
          old_password: "当前密码",
          new_password: "新密码"
        };
        return labels[field] || field || "输入";
      }

      function formatValidationItem(field, item) {
        const label = fieldLabel(field);
        const type = item.type || "";
        const ctx = item.ctx || {};
        if (type === "missing") return `请填写${label}`;
        if (type === "string_too_short") return `${label}至少需要 ${ctx.min_length || 1} 个字符`;
        if (type === "string_too_long") return `${label}不能超过 ${ctx.max_length || "限制"} 个字符`;
        if (type === "string_pattern_mismatch") return `${label}格式不正确`;
        if (type === "string_type") return `${label}必须是文本`;
        return `${label}: ${item.msg || item.message || "输入不符合要求"}`;
      }

      function errorMessage(err) {
        return err && err.message ? String(err.message) : String(err || "请求失败");
      }

      function setSession(token, user) {
        authToken = token || "";
        currentUser = user || null;
        if (authToken) localStorage.setItem("you2music.jwt", authToken);
        else localStorage.removeItem("you2music.jwt");
        const ok = Boolean(authToken && currentUser && currentUser.role === "admin");
        loginCard.classList.toggle("hidden", ok);
        adminApp.classList.toggle("hidden", !ok);
        if (ok) {
          document.getElementById("accountName").textContent = currentUser.username;
          document.getElementById("accountRole").textContent = currentUser.role;
        }
      }

      async function login() {
        loginError.textContent = "";
        loginStatus.textContent = "登录中…";
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const data = await fetchJson("/api/auth/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        if (!data.user || data.user.role !== "admin") throw new Error("当前账户不是管理员");
        setSession(data.token, data.user);
        loginStatus.textContent = "";
        await Promise.all([loadUsers(), loadInviteCodes(), loadConfig()]);
      }

      async function initSession() {
        if (!authToken) {
          setSession("", null);
          return;
        }
        try {
          const data = await fetchJson("/api/auth/me");
          if (!data.user || data.user.role !== "admin") throw new Error("not admin");
          setSession(authToken, data.user);
          await Promise.all([loadUsers(), loadInviteCodes(), loadConfig()]);
        } catch {
          setSession("", null);
        }
      }

      async function loadUsers() {
        usersOut.innerHTML = '<div class="muted">加载中…</div>';
        const data = await fetchJson("/api/admin/users");
        const users = data.users || [];
        if (!users.length) {
          usersOut.innerHTML = '<div class="muted">暂无用户。</div>';
          return;
        }
        const rows = users.map(u => `
          <tr data-user-id="${u.id}">
            <td data-label="ID">${u.id}</td>
            <td data-label="用户名">${escapeHtml(u.username)}</td>
            <td data-label="角色">
              <select data-field="role">
                <option value="user" ${u.role === "user" ? "selected" : ""}>user</option>
                <option value="admin" ${u.role === "admin" ? "selected" : ""}>admin</option>
              </select>
            </td>
            <td data-label="每日配额"><input type="number" min="0" data-field="daily_quota" value="${u.daily_quota}"></td>
            <td data-label="禁用"><input type="checkbox" data-field="disabled" ${u.disabled ? "checked" : ""}></td>
            <td data-label="操作" class="actions">
              <button data-action="save">保存</button>
              <button class="danger" data-action="delete">删除</button>
            </td>
          </tr>
        `).join("");
        usersOut.innerHTML = `<table><thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>每日配额</th><th>禁用</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;
      }

      async function loadInviteCodes() {
        const data = await fetchJson("/api/admin/invite-codes");
        const codes = data.invite_codes || [];
        if (!codes.length) {
          inviteOut.innerHTML = '<div class="muted">暂无邀请码。</div>';
          return;
        }
        inviteOut.innerHTML = codes.map(c => {
          const state = c.used_by ? `已使用：用户 ${c.used_by}` : "未使用";
          return `<div><span class="mono">${escapeHtml(c.code)}</span> <span class="muted">${state}</span></div>`;
        }).join("");
      }

      async function createInviteCode() {
        inviteStatus.textContent = "生成中…";
        const data = await fetchJson("/api/admin/invite-codes", { method: "POST" });
        inviteStatus.textContent = `新邀请码：${data.invite_code && data.invite_code.code ? data.invite_code.code : ""}`;
        await loadInviteCodes();
      }

      async function saveUser(row) {
        const userId = row.getAttribute("data-user-id");
        const role = row.querySelector('[data-field="role"]').value;
        const daily_quota = parseInt(row.querySelector('[data-field="daily_quota"]').value, 10);
        const disabled = row.querySelector('[data-field="disabled"]').checked;
        await fetchJson(`/api/admin/users/${userId}`, {
          method: "PUT",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ role, daily_quota, disabled })
        });
        await loadUsers();
      }

      async function deleteUser(row) {
        const userId = row.getAttribute("data-user-id");
        if (!window.confirm("确定删除该用户？")) return;
        await fetchJson(`/api/admin/users/${userId}`, { method: "DELETE" });
        await loadUsers();
      }

      async function loadConfig() {
        configError.textContent = "";
        configStatus.textContent = "加载配置中…";
        const data = await fetchJson("/api/admin/config");
        configJson.value = JSON.stringify(data.config || {}, null, 2);
        configStatus.textContent = "配置已加载";
      }

      async function saveConfig() {
        configError.textContent = "";
        configStatus.textContent = "保存配置中…";
        let cfg;
        try { cfg = JSON.parse(configJson.value || "{}"); } catch (e) { throw new Error("JSON 解析失败: " + e); }
        if (cfg && typeof cfg === "object") delete cfg.admin_token;
        await fetchJson("/api/admin/config", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ config: cfg })
        });
        configStatus.textContent = "配置已保存";
      }

      async function reloadConfig() {
        configStatus.textContent = "应用中…";
        await fetchJson("/api/admin/reload", { method: "POST" });
        configStatus.textContent = "已应用";
      }

      async function runTest() {
        configStatus.textContent = "测试中…";
        const data = await fetchJson("/api/admin/test", { method: "POST" });
        testOut.textContent = JSON.stringify(data, null, 2);
        configStatus.textContent = "测试完成";
      }

      function escapeHtml(s) {
        return String(s || "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
      }

      document.getElementById("loginBtn").addEventListener("click", () => login().catch(e => {
        loginStatus.textContent = "";
        loginError.textContent = errorMessage(e);
      }));
      document.getElementById("logoutBtn").addEventListener("click", () => setSession("", null));
      document.getElementById("reloadUsersBtn").addEventListener("click", () => loadUsers().catch(e => { usersOut.innerHTML = `<div class="err">${escapeHtml(String(e))}</div>`; }));
      document.getElementById("createInviteBtn").addEventListener("click", () => createInviteCode().catch(e => { inviteStatus.textContent = String(e); }));
      document.getElementById("loadConfigBtn").addEventListener("click", () => loadConfig().catch(e => { configError.textContent = String(e); }));
      document.getElementById("saveConfigBtn").addEventListener("click", () => saveConfig().catch(e => { configError.textContent = String(e); configStatus.textContent = ""; }));
      document.getElementById("reloadConfigBtn").addEventListener("click", () => reloadConfig().catch(e => { configError.textContent = String(e); configStatus.textContent = ""; }));
      document.getElementById("testBtn").addEventListener("click", () => runTest().catch(e => { configError.textContent = String(e); configStatus.textContent = ""; }));
      usersOut.addEventListener("click", e => {
        const action = e.target && e.target.getAttribute ? e.target.getAttribute("data-action") : "";
        if (!action) return;
        const row = e.target.closest("tr");
        if (action === "save") saveUser(row).catch(err => alert(String(err)));
        if (action === "delete") deleteUser(row).catch(err => alert(String(err)));
      });

      initSession();
    </script>
  </body>
</html>
