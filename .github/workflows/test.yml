name: Test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: API Integration Tests
        run: |
          pytest -c backend/pytest.ini backend/tests/test_api/ -v --tb=short --cov=backend --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  e2e-smoke:
    needs: api-tests
    if: vars.ENABLE_E2E == '1' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Install Playwright
        run: |
          cd frontend/e2e
          npm install
          npx playwright install chromium --with-deps

      - name: E2E Smoke Tests
        run: |
          cd frontend/e2e
          npx playwright test --grep @smoke --retries=1 --trace=on-first-retry

  e2e-full:
    needs: api-tests
    if: vars.ENABLE_E2E == '1' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Install Playwright
        run: |
          cd frontend/e2e
          npm install
          npx playwright install chromium --with-deps

      - name: E2E Full Suite
        run: |
          cd frontend/e2e
          npx playwright test --retries=1 --trace=on-first-retry

